<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css" />
    <title>Brussels CapeTown</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <img src="img/brusselscapetown.png" class="center" alt="Brussels and Cape Town">

        <section id="contact">
            <div class="contact-form">
                <h3>JOIN OUR FRIENDSLIST</h3>
                <p>BE THE FIRST <br> TO GET <br>NEWS</p>
                <div class="content">
                    <form action="https://formspree.io/f/meoqbawg" method="POST">
                        <label>Your email</label>
                        <input type="email" name="email" required>
                        <button type="submit">Send</button>
                    </form>
                    <div class="social">
                        <a href="https://www.instagram.com/brusselscapetown/" target="_blank">
                            <i class="fa-brands fa-instagram"></i>
                        </a>
                        <a href="https://www.youtube.com/@BrusselsCapeTown" target="_blank">
                            <i class="fa-brands fa-youtube"></i>
                        </a>
                        <a href="https://strava.app.link/zqCgbKqGxPb " target="_blank">
                            <i class="fa-brands fa-strava"></i>
                        </a>
                        <a href="mailto:info@brusselscapetown.com">
                            <i class="fa-solid fa-square-envelope"></i>
                        </a>
                    </div>
                </div>
            </div>
        </section>
    </div>
</body>

</html>
